[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-reliability"
version = "0.1.0.dev0"
description = "Evaluation, regression gating, red-teaming and incident-driven testing for LLM, RAG and agent systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "M-amir1998" }]
keywords = ["llm", "evaluation", "reliability", "red-teaming", "regression-testing", "llmops", "agents", "rag"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "pyarrow>=16",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "psutil>=5.9",
]

[project.optional-dependencies]
observability = [
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.scripts]
aireliability = "ai_reliability.cli.main:app"

[project.urls]
Repository = "https://github.com/M-amir1998/AI-Reliability-Lab"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.22",
    "types-psutil>=5.9",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_reliability"]

[tool.hatch.build.targets.sdist]
include = ["src/ai_reliability", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PTH", "S", "BLE", "RET", "PL", "TID"]
ignore = [
    "N818",     # error names follow the documented exception model (InvalidTestCase, ...)
    "S105",     # false positives on enum members such as Outcome.PASS
    "E501",     # ruff format owns line length; long strings/messages are allowed
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "S101",     # asserts are fine in tests; production code uses explicit errors
    "S311",     # seeded non-crypto RNG is intentional for reproducible mutations
    "RUF001", "RUF002", "RUF003",  # unicode fixtures are intentional (robustness tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PLC0415", "N802"]
"src/ai_reliability/cli/**" = ["B008", "PLC0415"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pickle".msg = "Never deserialize untrusted model output with pickle."

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ai_reliability"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*", "scipy.*", "prometheus_client.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "property: Hypothesis property-based tests",
    "integration: multi-component tests using mock systems",
    "e2e: CPU end-to-end flows (CLI and demos)",
    "security: red-team and privacy tests",
    "benchmark: CPU overhead benchmarks (not LLM inference)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["ai_reliability"]
branch = true

[tool.coverage.report]
show_missing = false
skip_covered = true
