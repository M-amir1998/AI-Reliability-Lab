# Optional local observability stack. Nothing here is required for CI or evaluation.
#   docker compose up --build
# - lab:        runs the offline release-gate demo, then serves stored-run metrics on :9108
# - prometheus: scrapes lab:9108 (http://localhost:9090)
# - grafana:    http://localhost:3000 (anonymous viewer; local use only)
services:
  lab:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aireliability demo release-gate --output /workspace/demo && aireliability metrics serve --root /workspace/demo --host 0.0.0.0 --port 9108
    ports: ["127.0.0.1:9108:9108"]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [lab]
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
